<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire ID Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .box { background: #1e1e1e; padding: 20px; margin: 15px auto; border-radius: 8px; max-width: 400px; }
        input, button, textarea { width: 90%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        button { background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
        .chat-box { background: #222; padding: 10px; border-radius: 5px; height: 150px; overflow-y: scroll; text-align: left; font-size: 14px; margin-bottom: 10px; }
        .msg-user { color: #4cd137; margin: 5px 0; }
        .msg-admin { color: #ff4757; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Free Fire ID Buy & Sell Store</h1>

    <div class="box">
        <h3>Buy Free Fire ID</h3>
        <form id="buyForm">
            <input type="text" id="selectedId" placeholder="Enter ID Number (e.g. #101)" required>
            <input type="text" id="buyerNumber" placeholder="Your Mobile Number" required>
            <input type="text" id="cashoutNumber" placeholder="Cashout Number (Agent/Admin)" required>
            <input type="text" id="trxId" placeholder="Transaction ID (TrxID)" required>
            <button type="submit">Submit Buy Request</button>
        </form>
    </div>

    <div class="box">
        <h3>Live Admin Chat & Status</h3>
        <div class="chat-box" id="chatDisplay">
            <div class="msg-admin">Admin: Hello! Kono help lagle ekhane message korun.</div>
        </div>
        <input type="text" id="chatInput" placeholder="Type your message to admin...">
        <button id="sendChatBtn">Send Message</button>
    </div>

    <script>
        document.getElementById('buyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                selectedId: document.getElementById('selectedId').value,
                buyerNumber: document.getElementById('buyerNumber').value,
                cashoutNumber: document.getElementById('cashoutNumber').value,
                trxId: document.getElementById('trxId').value
            };
            await fetch('/api/buy', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert('Buy request submitted to Admin Telegram!');
        });

        document.getElementById('sendChatBtn').addEventListener('click', async () => {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            
            await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sender: 'User', message: input.value })
            });
            input.value = '';
            loadMessages();
        });

        async function loadMessages() {
            const res = await fetch('/api/messages');
            const messages = await res.json();
            const chatDisplay = document.getElementById('chatDisplay');
            chatDisplay.innerHTML = '<div class="msg-admin">Admin: Hello! Kono help lagle ekhane message korun.</div>';
            messages.forEach(m => {
                const div = document.createElement('div');
                div.className = m.sender === 'Admin' ? 'msg-admin' : 'msg-user';
                div.innerHTML = `<b>${m.sender}:</b> ${m.message} <span style="font-size:10px; color:#888;">(${m.time})</span>`;
                chatDisplay.appendChild(div);
            });
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        setInterval(loadMessages, 3000); // Refresh chat every 3 seconds
    </script>
</body>
</html>
