<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire ID Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .box { background: #1e1e1e; padding: 20px; margin: 15px auto; border-radius: 8px; max-width: 400px; }
        input, button { width: 90%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        button { background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Free Fire ID Buy & Sell Store</h1>

    <div class="box">
        <h3>Buy Free Fire ID</h3>
        <form id="buyForm">
            <input type="text" id="selectedId" placeholder="Enter ID Number (e.g. #101)" required>
            <input type="text" id="buyerNumber" placeholder="Your Mobile Number" required>
            <input type="text" id="cashoutNumber" placeholder="Cashout Number (Agent/Admin)" required>
            <input type="text" id="trxId" placeholder="Transaction ID (TrxID)" required>
            <button type="submit">Submit Buy Request</button>
        </form>
    </div>

    <div class="box">
        <h3>Sell Your ID</h3>
        <form id="sellForm">
            <input type="email" id="sellerEmail" placeholder="FF Account Email" required>
            <input type="text" id="sellerPassword" placeholder="FF Account Password" required>
            <input type="number" id="price" placeholder="Asking Price (BDT)" required>
            <button type="submit">Submit ID for Sale</button>
        </form>
    </div>

    <script>
        document.getElementById('buyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                selectedId: document.getElementById('selectedId').value,
                buyerNumber: document.getElementById('buyerNumber').value,
                cashoutNumber: document.getElementById('cashoutNumber').value,
                trxId: document.getElementById('trxId').value
            };
            const res = await fetch('/api/buy', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert('Buy request submitted to Admin Telegram!');
        });

        document.getElementById('sellForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                sellerEmail: document.getElementById('sellerEmail').value,
                sellerPassword: document.getElementById('sellerPassword').value,
                price: document.getElementById('price').value
            };
            const res = await fetch('/api/sell', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert('ID submitted to Admin Telegram securely!');
        });
    </script>
</body>
</html>
